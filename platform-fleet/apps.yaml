# Platform apps: one deployment repo each, all created from platform-app-template.
# The promoter and the Taskfile use this to know where to open PRs, record
# Deployments and create Environments. `task fleet:render` turns it into
# fleet/apps/<name>.yaml (GitRepository + Kustomization per app).
owner: twallac10
apps:
  - name: kyverno
    repo: platform-kyverno
    namespace: kyverno
    dependsOn: []
  - name: guardrails          # promoted like any other app (chart built from source)
    repo: platform-guardrails
    namespace: guardrails
    dependsOn: [kyverno]
  - name: kyverno-policies
    repo: platform-kyverno-policies
    namespace: kyverno-policies
    dependsOn: [kyverno]
  - name: kube-prometheus-stack
    repo: platform-kube-prometheus-stack
    namespace: monitoring
    dependsOn: [guardrails, kyverno-policies]
  - name: otel-collector
    repo: platform-otel-collector
    namespace: otel
    dependsOn: [kube-prometheus-stack]   # ships a ServiceMonitor
# Not promoted; lives in platform-fleet/canary and is identical in every tier.
canary:
  namespace: canary
  dependsOn: [kyverno-policies, guardrails, kube-prometheus-stack, otel-collector]
