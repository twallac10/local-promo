# The promotion chain, in order. Adding a tier is config only:
#   1. add it here
#   2. `task fleet:render` (creates clusters/<tier>/ and tiers/<tier>/ stubs)
# A tier is a list of clusters (kube contexts); the evidence gate must pass on
# every cluster in a tier before the next tier's PR is opened.
tiers:
  - name: dev
    clusters: [kind-tier-dev]
    requiresApproval: false
  - name: stg
    clusters: [kind-tier-stg]
    requiresApproval: false
  - name: prd
    clusters: [kind-tier-prd]
    requiresApproval: true
